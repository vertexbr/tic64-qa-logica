[pytest]
# Sem esta linha o pytest varre o repositório inteiro e coleta também os
# arquivos test_*.py de aulas/aula08/, que existem para ser rodados um por vez
# durante a aula e seis deles falham de propósito.
#
# Com ela, `pytest` sem argumento roda só o que está em tests/, que é o que o
# README promete. Rodar um arquivo de demonstração continua funcionando: basta
# passar o caminho dele, como em `pytest aulas/aula08/test_aula08_regras.py`.
#
# A linha governa a descoberta automática, não o caminho que você passa na mão. Por isso
# `pytest .`, com o ponto, escapa dela: o ponto pede o repositório inteiro e alcança os
# arquivos de demonstração das pastas de aula. Medido em 03/09/2026, depois da Aula 09:
# a execução é INTERROMPIDA na coleta, porque test_aula09_nome_errado.py e
# test_aula09_massa_desalinhada.py erram na coleta de propósito, e erro de coleta aborta
# tudo. Nenhum teste roda. Não é defeito do repositório, e o README da raiz avisa o aluno
# a rodar `pytest` sem o ponto.
testpaths = tests

# O pytest esconde o motivo de um teste pulado, e a suíte de autoverificação da
# Aula 08 pula com uma mensagem que diz onde o aluno precisa salvar a entrega.
# Sem esta linha ele lê só "1 skipped" e não descobre o que faltou.
#
# São quatro letras e não uma: o padrão do pytest é -rfE, e escrever só -rs
# SUBSTITUI esse padrão em vez de somar a ele. Medido: com -rs sozinho o
# "short test summary info" some das falhas, e ele aparece em dois slides do
# deck desta aula.
addopts = -rfEs
